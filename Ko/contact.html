              <script>
                document.addEventListener(
                  "DOMContentLoaded",
                  function () {
                    const form = document.querySelector(
                      ".contact__form--inner"
                    );
                    const successMessage =
                      document.getElementById("form-message");

                    // Function to generate a random challenge question
                    function generateChallengeQuestion() {
                      const num1 = Math.floor(Math.random() * 10) + 1;
                      const num2 = Math.floor(Math.random() * 10) + 1;
                      const operator = Math.random() < 0.5 ? "+" : "-";
                      const question = `${num1} ${operator} ${num2}`;
                      const answer = eval(question); // Calculate the answer

                      return { question, answer };
                    }

                    const challenge = generateChallengeQuestion();
                    document.getElementById(
                      "challenge-question"
                    ).innerText = challenge.question;
                    document.getElementById(
                      "challenge-answer-hidden"
                    ).value = challenge.answer;

                    form.addEventListener("submit", function (e) {
                      e.preventDefault();

                      if (validateForm()) {
                        const formData = new FormData(form);

                        // Send a POST request to your PHP script using fetch
                        fetch("php/contact_store.php", {
                          method: "POST",
                          body: formData,
                        })
                          .then((response) => response.json())
                          .then((data) => {
                            if (data.success) {
                              // Display the success message on the page
                              successMessage.innerHTML = data.message;
                              form.reset(); // Optionally, reset the form fields
                              generateChallengeQuestion();
                            } else {
                              // Handle errors if needed
                              successMessage.innerHTML =
                                "Error: " + data.message;
                            }
                          })
                          .catch((error) => {
                            console.log("Error:", error);
                          });
                      }
                    });

                    function validateForm() {
                      const firstName =
                        form.querySelector('[name="firstname"]').value;
                      const lastName =
                        form.querySelector('[name="lastname"]').value;
                      const phoneNumber =
                        form.querySelector('[name="number"]').value;
                      const email =
                        form.querySelector('[name="email"]').value;
                      const message =
                        form.querySelector('[name="message"]').value;
                      const termsAccepted = form.querySelector(
                        '[name="accept-terms"]'
                      ).checked;
                      const userAnswer = form.querySelector(
                        '[name="challenge-answer"]'
                      ).value;
                      const correctAnswer = document.getElementById(
                        "challenge-answer-hidden"
                      ).value;

                      // Validate Challenge Answer
                      if (
                        parseInt(userAnswer) !== parseInt(correctAnswer)
                      ) {
                        alert("Challenge question answer is incorrect.");
                        return false;
                      }

                      // Validate First Name
                      if (firstName.length < 3) {
                        alert(
                          "First name should have at least 3 letters."
                        );
                        return false;
                      }

                      if (lastName.length < 3) {
                        alert(
                          "Last name should have at least 3 letters."
                        );
                        return false;
                      }
                      // Validate Phone Name
                      if (!/^[0-9+]+$/.test(phoneNumber)) {
                        alert(
                          "Phone number should accept only numbers and '+'."
                        );
                        return false;
                      }
                      // Validate Email
                      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                      if (!emailPattern.test(email)) {
                        alert("Please enter a valid email address.");
                        return false;
                      }

                      // Validate Message
                      if (message.trim().length === 0) {
                        alert("Please enter your message.");
                        return false;
                      }

                      // Validate Terms and Conditions
                      if (!termsAccepted) {
                        alert(
                          "You must accept the terms and conditions."
                        );
                        return false;
                      }
                      return true;
                    }
                  }
                );
              </script>
